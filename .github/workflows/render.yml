- name: Preflight Asset Check
        env:
          MANIFEST_PATH: ${{ env.MANIFEST_PATH || 'manifest.json' }}
          GDRIVE_REMOTE: ${{ env.GDRIVE_REMOTE || 'gdrive' }}
          GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
        run: |
          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          manifest_path = Path(os.getenv("MANIFEST_PATH", "manifest.json"))
          if not manifest_path.is_file():
              print(f"❌ Манифест не найден: {manifest_path}", file=sys.stderr)
              sys.exit(1)

          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          scenes = manifest.get("timeline") or manifest.get("scenes") or []
          if not scenes:
              print("❌ В манифесте не найдено ни одной сцены (timeline / scenes пуст)!", file=sys.stderr)
              sys.exit(1)

          folder_id = os.getenv("GDRIVE_FOLDER_ID") or manifest.get("gdrive_folder_id") or manifest.get("folder_id")
          remote = os.getenv("GDRIVE_REMOTE", "gdrive")

          remote_files = set()
          if folder_id:
              res = subprocess.run(
                  ["rclone", "lsf", f"{remote}:", "--recursive", "--files-only", "--drive-root-folder-id", folder_id],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              remote_files = {line.strip() for line in res.stdout.splitlines() if line.strip()}

          missing = []
          verified_video = 0
          verified_audio = 0

          for idx, sc in enumerate(scenes, 1):
              assets = sc.get("assets") or {}
              v_file = (
                  sc.get("file_name")
                  or sc.get("video_file")
                  or assets.get("video_file")
                  or assets.get("image_reference")
              )
              a_file = (
                  sc.get("voiceover_file")
                  or sc.get("audio_file")
                  or assets.get("voiceover_file")
              )

              if not v_file:
                  missing.append(f"Сцена #{idx}: не указано имя видеофайла (file_name / assets.video_file)")
                  continue

              v_exists = (
                  Path(v_file).is_file()
                  or (Path("assets") / v_file).is_file()
                  or (v_file in remote_files)
                  or (Path(v_file).name in remote_files)
              )
              if v_exists:
                  verified_video += 1
              else:
                  missing.append(f"Сцена #{idx}: видеофайл не найден -> {v_file}")

              if a_file:
                  a_exists = (
                      Path(a_file).is_file()
                      or (Path("assets") / a_file).is_file()
                      or (a_file in remote_files)
                      or (Path(a_file).name in remote_files)
                  )
                  if a_exists:
                      verified_audio += 1
                  else:
                      missing.append(f"Сцена #{idx}: аудиофайл не найден -> {a_file}")

          if missing:
              print("❌ Ошибка проверки ассетов перед рендером:", file=sys.stderr)
              for err in missing:
                  print(f"  - {err}", file=sys.stderr)
              sys.exit(1)

          print(f"✅ Verified {len(scenes)} scenes ({verified_video} video, {verified_audio} audio files) on Google Drive!")
          EOF

name: Studio Regression
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
      - run: bun run build
      - name: Browser IndexedDB acceptance
        run: |
          python -m pip install playwright==1.51.0
          python -m playwright install --with-deps chromium
          mkdir -p /tmp/aether-browser-smoke
          bun build tests/browser-storage-smoke.ts --target browser --outfile /tmp/aether-browser-smoke/smoke.js
          printf '<html><body><script type="module" src="/smoke.js"></script></body></html>' > /tmp/aether-browser-smoke/index.html
          python -m http.server 8765 --bind 127.0.0.1 --directory /tmp/aether-browser-smoke &
          server_pid=$!
          trap 'kill "$server_pid" || true' EXIT
          for i in $(seq 1 30); do curl -fsS http://127.0.0.1:8765/ >/dev/null && break; sleep 1; done
          python tests/browser-storage-smoke.py
          mkdir -p /tmp/aether-browser-smoke/aethercombine-studio
          cp -r dist/. /tmp/aether-browser-smoke/aethercombine-studio/
          python tests/browser-ui-isolation.py
      - name: Synthetic loop renderer integration
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y ffmpeg
          work=$(mktemp -d)
          bun tests/export-loop-fixture.ts > "$work/manifest.json"
          bun tests/export-loop-fixture.ts --advanced > "$work/advanced.json"
          curl --fail --silent --show-error --location https://raw.githubusercontent.com/ZermeXX/aetherflow-render/eb2a44e2e25afd4cb3f518f87876b1bf0e161c49/build_timeline.py -o "$work/build_timeline.py"
          cd "$work"
          mkdir input_clips
          ffmpeg -v error -f lavfi -i color=c=blue:s=1280x720:r=24 -f lavfi -i sine=frequency=440:sample_rate=48000 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac input_clips/base.mp4
          # Never permit cloud fallback in this local fixture.
          mkdir blocked-bin
          printf '#!/bin/sh\nexit 99\n' > blocked-bin/rclone
          chmod +x blocked-bin/rclone
          PATH="$PWD/blocked-bin:$PATH" python build_timeline.py 2>&1 | tee render.log
          if grep -Ei "non.monotoni(c|cally)|queue input is backward in time" render.log; then exit 1; fi
          python - <<'PY'
          import json, subprocess
          result=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json","output.mp4"]))
          video=next(s for s in result["streams"] if s["codec_type"]=="video")
          assert (video["width"],video["height"],video["r_frame_rate"])==(1280,720,"24/1")
          assert any(s["codec_type"]=="audio" for s in result["streams"])
          assert abs(float(result["format"]["duration"])-5)<0.25
          assert json.load(open("qc_report.json"))["status"]=="PASS"
          print("SYNTHETIC_LOOP_RENDER_PASS")
          PY
          cp advanced.json manifest.json
          ffmpeg -v error -f lavfi -i color=c=green:s=1280x720:r=24 -f lavfi -i sine=frequency=660:sample_rate=48000 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac input_clips/green.mp4
          ffmpeg -v error -f lavfi -i color=c=red:s=1280x720:r=24 -f lavfi -i sine=frequency=880:sample_rate=48000 -t 2 -c:v libx264 -pix_fmt yuv420p -c:a aac input_clips/red.mp4
          rm -f output.mp4 qc_report.json
          PATH="$PWD/blocked-bin:$PATH" python build_timeline.py 2>&1 | tee render.log
          if grep -Ei "non.monotoni(c|cally)|queue input is backward in time" render.log; then exit 1; fi
          python - <<'PY'
          import json, subprocess
          m=json.load(open("manifest.json"))
          assert m["timeline_slots"][1]["start_sec"]==7
          assert m["timeline_slots"][1]["inserts"][0]["trigger_at_sec"]==10
          result=json.loads(subprocess.check_output(["ffprobe","-v","error","-show_streams","-show_format","-of","json","output.mp4"]))
          video=next(s for s in result["streams"] if s["codec_type"]=="video")
          assert (video["width"],video["height"],video["r_frame_rate"])==(1280,720,"24/1")
          assert any(s["codec_type"]=="audio" for s in result["streams"])
          duration=float(result["format"]["duration"])
          print("ADVANCED_RENDER_DURATION",duration)
          assert abs(duration-15)<0.5, duration
          def rgb(t):
              return tuple(subprocess.check_output(["ffmpeg","-v","error","-ss",str(t),"-i","output.mp4","-frames:v","1","-vf","scale=1:1","-pix_fmt","rgb24","-f","rawvideo","pipe:1"])[:3])
          blue,green,red,after=map(rgb,[2,8.5,11,13.5])
          print("ADVANCED_RENDER_RGB",blue,green,red,after)
          assert blue[2]>blue[0]+40 and blue[2]>blue[1]+40
          assert green[1]>green[0]+40 and green[1]>green[2]+40
          assert red[0]>red[1]+40 and red[0]>red[2]+40
          assert after[1]>after[0]+40 and after[1]>after[2]+40
          assert json.load(open("qc_report.json"))["status"]=="PASS"
          packets=json.loads(subprocess.check_output(["ffprobe","-v","error","-select_streams","a:0","-show_packets","-show_entries","packet=dts","-of","json","output.mp4"]))["packets"]
          dts=[int(p["dts"]) for p in packets]
          assert len(dts)>1 and all(a<b for a,b in zip(dts,dts[1:])), "Non-monotonic audio packet DTS"
          print("ADVANCED_AUDIO_DTS_PASS",len(dts))
          print("ADVANCED_LOOP_RENDER_PASS")
          PY

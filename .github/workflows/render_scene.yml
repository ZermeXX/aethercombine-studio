name: AETHER COMBINE Narrative Scene Render (v2.2-FINAL)

on:
  workflow_dispatch:
    inputs:
      manifest_payload:
        description: 'Base64-encoded JSON manifest payload (v2.2-FINAL)'
        required: true
        type: string
      preflight_only:
        description: 'Run asset preflight verification only'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  render_scene:
    name: Narrative 4K 3-Step Master Assembly Pipeline
    runs-on: ubuntu-latest
    env:
      MANIFEST_PATH: manifest.json
      GDRIVE_REMOTE: gdrive
      GDRIVE_FOLDER_ID: ${{ secrets.GDRIVE_FOLDER_ID }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install FFmpeg, Python, jq, fonts & rclone
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3 jq curl unzip fonts-dejavu-core
          if ! command -v rclone >/dev/null 2>&1; then
            curl -fsSL https://rclone.org/install.sh | sudo bash
          fi
          ffmpeg -version | head -n 2
          rclone version | head -n 2

      - name: Configure Rclone for Google Drive
        env:
          RCLONE_CONFIG_DATA: ${{ secrets.RCLONE_CONFIG_DATA }}
        run: |
          mkdir -p ~/.config/rclone
          if [ -n "$RCLONE_CONFIG_DATA" ]; then
            echo "$RCLONE_CONFIG_DATA" > ~/.config/rclone/rclone.conf
          fi

      - name: Decode Manifest Payload
        env:
          MANIFEST_B64: ${{ inputs.manifest_payload }}
        run: |
          python3 - << 'EOF'
          import base64, json, os, sys
          raw = os.environ.get("MANIFEST_B64", "").strip()
          if not raw:
              print("❌ Missing manifest_payload input", file=sys.stderr)
              sys.exit(1)
          decoded = base64.b64decode(raw).decode("utf-8")
          obj = json.loads(decoded)
          with open("manifest.json", "w", encoding="utf-8") as f:
              json.dump(obj, f, ensure_ascii=False, indent=2)
          print(f"✅ Decoded manifest.json (project={obj.get('project_name')}, version={obj.get('manifest_version', '2.2-FINAL')})")
          EOF

      - name: Preflight Asset Check
        run: |
          python3 - << 'EOF'
          import json
          import os
          import subprocess
          import sys
          from pathlib import Path

          manifest_path = Path(os.getenv("MANIFEST_PATH", "manifest.json"))
          if not manifest_path.is_file():
              print(f"❌ Manifest not found: {manifest_path}", file=sys.stderr)
              sys.exit(1)

          with manifest_path.open("r", encoding="utf-8") as f:
              manifest = json.load(f)

          scenes = manifest.get("timeline") or manifest.get("scenes") or []
          if not scenes:
              print("❌ Manifest contains no scenes (timeline / scenes is empty)", file=sys.stderr)
              sys.exit(1)

          folder_id = (
              os.getenv("GDRIVE_FOLDER_ID")
              or (manifest.get("cloud_export") or {}).get("target_folder_id")
              or manifest.get("gdrive_folder_id")
              or manifest.get("folder_id")
          )
          remote = os.getenv("GDRIVE_REMOTE", "gdrive")

          remote_files = set()
          if folder_id and Path(os.path.expanduser("~/.config/rclone/rclone.conf")).is_file():
              res = subprocess.run(
                  ["rclone", "lsf", f"{remote}:", "--recursive", "--files-only", "--drive-root-folder-id", folder_id],
                  capture_output=True,
                  text=True,
                  check=True,
              )
              remote_files = {line.strip() for line in res.stdout.splitlines() if line.strip()}

          def exists_anywhere(name: str | None) -> bool:
              if not name:
                  return True
              clean = str(name).strip()
              if not clean:
                  return True
              return (
                  Path(clean).is_file()
                  or (Path("assets") / clean).is_file()
                  or (Path("input") / clean).is_file()
                  or (clean in remote_files)
                  or (Path(clean).name in remote_files)
              )

          missing = []
          verified_video = 0
          verified_audio = 0
          verified_sfx = 0

          for idx, sc in enumerate(scenes, 1):
              assets = sc.get("assets") or {}
              aud_proc = sc.get("audio_processing") or {}
              v_file = (
                  sc.get("file_name")
                  or sc.get("video_file")
                  or assets.get("video_file")
                  or assets.get("image_reference")
              )
              a_file = (
                  sc.get("voiceover_file")
                  or sc.get("audio_file")
                  or assets.get("voiceover_file")
                  or assets.get("audio_file")
              )
              sfx_file = aud_proc.get("sfx") or sc.get("sfx") or assets.get("sfx") or sc.get("sfx_file")

              if not v_file:
                  missing.append(f"Scene #{idx}: missing video filename (file_name / assets.video_file)")
              elif exists_anywhere(v_file):
                  verified_video += 1
              else:
                  missing.append(f"Scene #{idx}: video asset not found -> {v_file}")

              if a_file:
                  if exists_anywhere(a_file):
                      verified_audio += 1
                  else:
                      missing.append(f"Scene #{idx}: voiceover audio not found -> {a_file}")

              if sfx_file:
                  if exists_anywhere(sfx_file):
                      verified_sfx += 1
                  else:
                      missing.append(f"Scene #{idx}: SFX file not found -> {sfx_file}")

          ambient_file = ((manifest.get("ambient_audio") or {}).get("file_name") or (manifest.get("music_bed") or {}).get("file_name"))
          if ambient_file and not exists_anywhere(ambient_file):
              missing.append(f"Ambient music bed not found -> {ambient_file}")

          if missing:
              print("❌ Asset preflight check failed:", file=sys.stderr)
              for err in missing:
                  print(f"  - {err}", file=sys.stderr)
              sys.exit(1)

          print(f"✅ Verified {len(scenes)} scenes ({verified_video} video, {verified_audio} voiceover, {verified_sfx} SFX)!")
          EOF

      - name: Render 4K Narrative Master (3-Step full_voice + full_video Mux)
        if: ${{ !inputs.preflight_only }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          mkdir -p ./output ./output/shorts ./build/scenes
          python3 assemble_scenes.py manifest.json 2>&1 | tee ./build/render.log

      - name: Upload Master Video, SRTs & Shorts to Google Drive
        if: ${{ !inputs.preflight_only }}
        run: |
          FOLDER_ID=$(jq -r '.cloud_export.target_folder_id // .gdrive_folder_id // empty' manifest.json)
          DEST_FLAG=""
          if [ -n "$FOLDER_ID" ]; then
            DEST_FLAG="--drive-root-folder-id $FOLDER_ID"
          fi
          if [ -f ~/.config/rclone/rclone.conf ]; then
            rclone copy ./output gdrive:AetherFlow_Output $DEST_FLAG --drive-chunk-size 64M --transfers 2 --checkers 4 --retries 5 --low-level-retries 10 --stats 15s -v
          else
            echo "Skipping rclone upload: ~/.config/rclone/rclone.conf not configured"
          fi

      - name: Upload Render Artifacts & Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: aether-scene-render-outputs
          path: |
            ./output/*.mp4
            ./output/*.srt
            ./output/voice_timeline_map.json
            ./output/shorts/*.mp4
            ./build/render.log
            ./manifest.json
          if-no-files-found: ignore
          retention-days: 7
